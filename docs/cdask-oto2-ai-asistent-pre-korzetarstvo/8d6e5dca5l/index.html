KATALÓG A MATERIÁLY:
40 PROBLÉMOV S PADNUTÍM (číslo · problém · čo je vidieť · pravdepodobná príčina · oprava):
[Korzet · horná časť]
1 · Výstrih odstáva od tela · Medzi horným okrajom a prsiami je vzduch · Príčina: Obvod cez prsia je na strihu väčší než u zákazníčky, alebo je horný okraj príliš vysoko · Oprava: Prebytok na skúšobnom modeli zopni a označ; túto hodnotu uber rozdelenú do predných a bočných švov, len v línii pŕs, a krivku k pásu zmäkči.
2 · Hore tlačí prsia („efekt pretekania“) · Prsia vystupujú nad okraj · Príčina: Chýba obvod cez prsia, alebo sú košíčky na strihu na jej prsia malé · Oprava: Rozpáraj šev prsných dielov a pridaj, čo chýba, rozdelené medzi predné diely; ak je výstrih na jej prsia prinízko, zdvihni horný okraj.
3 · Pod prsiami sa robí vodorovný záhyb · Záhyb z jednej strany na druhú pod prsiami · Príčina: Predná dĺžka do pása je väčšia než u zákazníčky, alebo je obvod pod prsiami privoľný · Oprava: Prebytok na skúšobnom modeli označ a strih skráť v línii pod prsiami, alebo uber obvod pod prsiami v predných švoch.
4 · Košíčky odstávajú alebo sa v nich robí jamka · Látka nedosadá na prsia · Príčina: Objem košíčka je väčší než objem pŕs zákazníčky · Oprava: Zmenši krivku prsného švu (uber objem vo vrchole krivky) a znova vyskúšaj; obvod neuberaj.
5 · Horný okraj sa zarezáva pod pazuchou · Prekáža, keď spustí ruky · Príčina: Bok je príliš vysoko · Oprava: Horný okraj na boku postupne zníž o 1 až 2 cm a krivku napoj na predný a zadný diel.
6 · Vyzerá ploché a nevytvaruje prsia · Predný diel zostáva rovný · Príčina: Strih má rovnú siluetu, alebo má zákazníčka väčšie prsia než základný strih · Oprava: Pridaj krivku do švov prsných dielov, alebo zvoľ strih s väčším objemom.
7 · Busk sa ohýba alebo hore odstáva · Predné zapínanie nedosadá rovno · Príčina: Veľké napätie cez prsia, alebo je busk dlhší než rovná časť trupu · Oprava: Skontroluj obvod cez prsia; ak problém trvá, zvoľ kratší alebo zahnutý busk.
8 · Vykúkajú ramienka podprsenky alebo to nejde dokopy s bielizňou · Neladí to s tým, čo má pod tým · Príčina: Skúška prebehla bez bielizne, ktorú bude nosiť · Oprava: Zopakuj skúšku s finálnou bielizňou, alebo pridaj ramienka priamo na korzet.
[Korzet · pás a boky]
9 · Záhyb v páse na boku · Šikmé záhyby vo výške pása · Príčina: Línia pása na strihu nezodpovedá jej skutočnému pásu · Oprava: Skutočný pás označ na skúšobnom modeli stuhou a líniu pása na strihu posuň nahor alebo nadol na všetkých dieloch.
10 · V páse veľmi sťahuje · Bolí alebo zanecháva otlaky · Príčina: Zúženie pása je väčšie, než zákazníčka znesie · Oprava: Pridaj šírku v páse, rozdelenú do všetkých švov; korzet určený na pohodlné nosenie veľké zúženie nepotrebuje.
11 · Pri sedení sa zarezáva do bokov · Vadí v sede · Príčina: Dĺžka pod pásom je väčšia než jej vzdialenosť pás–stehno v sede · Oprava: Skráť spodný okraj vpredu a na boku, alebo ho vpredu viac vykroj nahor.
12 · Na bokoch odstáva · Na bokoch je vzduch · Príčina: Obvod bokov je na strihu väčší než jej · Oprava: Prebytok uber v bočných a zadných švoch, len v oblasti bokov, pás zachovaj.
13 · Na bokoch tlačí a vyjazdí nahor · Korzet pri pohybe vyjazdí nahor · Príčina: Chýba obvod bokov, takže ho telo tlačí nahor · Oprava: Pridaj šírku na bokoch, rozdelenú do bočných a zadných švov.

15 · Kostice sa otláčajú alebo vyliezajú z tunelíka · Je vidieť koniec kostice · Príčina: Kostica dlhšia než tunelík, alebo zle uzavretý tunelík · Oprava: Kosticu skráť o 1 cm oproti tunelíku a konce ochráň; tunelík dobre uzavri ešte pred lemovaním.
16 · Látka sa medzi kosticami vlní · Na vrchnej látke sú vlny · Príčina: Vrchná látka bez pevnej vrstvy, alebo zle spojená s korzetovým keprom · Oprava: Vrchnú látku spoj s korzetovým keprom (alebo ju vystuž) ešte pred zošitím dielov.
[Korzet · chrbát a zapínanie]
17 · Chrbát sa nezatvára rovnomerne (hore alebo dole viac otvorený) · Medzera šnurovania robí V · Príčina: Tam, kde je medzera najširšia, chýba korzetu pre toto telo šírka · Oprava: Kde sa veľmi otvára, chýba obvod: keď sa viac otvára dole, pridaj na boky (bočné a zadné švy); keď hore, pridaj cez prsia alebo do hornej časti chrbta. Výpočet: medzera navyše (napríklad 9 − 4,5 = 4,5 cm) ÷ 2 = koľko pridáš ku každej polovici strihu, rozdelené medzi jej švy. Ideálna je rovnomerná medzera 4 až 5 cm.
18 · Chrbát sa zatvorí úplne, bez medzery · Oba okraje sa dotýkajú · Príčina: Korzet je priveľký · Oprava: Uber v bočných a zadných švoch, aby zostala rovnomerná medzera okolo 5 cm a dalo sa doladiť.
19 · Záhyb v dolnej časti chrbta · Vodorovné záhyby nad zadkom · Príčina: Zadná dĺžka je väčšia než jej, alebo výrazné prehnutie v krížoch · Oprava: Skráť v línii zadného pása, alebo pridaj krivku do zadného švu.
20 · Lopatky sa otláčajú alebo sa hore zarezáva · Vadí, keď hýbe rukami · Príčina: Zadný horný okraj príliš vysoko alebo pritesný · Oprava: Zadný okraj zníž o 1 až 2 cm, alebo pridaj trochu šírky do hornej časti chrbta.
21 · Šnúra kĺže a povoľuje · Treba ju často uťahovať · Príčina: Klzká šnúra alebo priechodky priďaleko od seba · Oprava: Použi plochú šnúru z bavlny alebo pevného saténu a priechodky vo vzdialenosti 2 až 2,5 cm.
22 · Priechodky sa vytrhávajú · Látka okolo sa trhá · Príčina: Pozdĺž priechodiek chýba výstuž alebo kostica · Oprava: Daj kosticu na každú stranu línie priechodiek a pevnú výstuž.
[Podprsenky a bralette]
23 · Ramienko padá z ramena · Pri pohybe zosúva · Príčina: Ramienko je na jej rameno príliš vonku · Oprava: Posuň ho o 1 až 2 cm k stredu, vzadu aj vpredu.
24 · Kostica sa zarezáva pod pazuchou · Vadí na boku · Príčina: Kostica dlhšia alebo širšia než základňa prsníka · Oprava: Použi kosticu o veľkosť menšiu, alebo kratšiu na boku.
25 · Stred nedosadá na hrudnú kosť · Mostík odstáva · Príčina: Košíčky primalé alebo kostica priúzka · Oprava: Zväčši košíček alebo použi širšiu kosticu.
26 · Obvodový pás vzadu vyjazdí · Chrbát ide nahor · Príčina: Pás je privoľný; váhu nesú ramienka · Oprava: Pás utiahni; má byť pevný a vodorovný.
27 · Prsia pretekajú hore alebo na boku košíčka · Prsia vystupujú von · Príčina: Košíček je malý · Oprava: Zväčši košíček v spojovacom šve, alebo prejdi na ďalšiu veľkosť košíčka.
28 · Záhyb v košíčku · Látka sa krčí · Príčina: Košíček je veľký · Oprava: Uber objem vo šve košíčka, alebo prejdi na predchádzajúcu veľkosť košíčka.
[Body a nohavičky]
29 · Body ťahá od ramena do rozkroku · Ťahá, keď sa vystrie alebo sadne · Príčina: Dĺžka trupu je na strihu menšia než jej · Oprava: Predĺž strih v línii pása: čo chýba, polovicu na predný diel a polovicu na zadný.
30 · Body robí v páse vrecko · Vpredu je priveľa látky · Príčina: Dĺžka trupu je priveľká · Oprava: Skráť v línii pása.
31 · Nohavičky sa vzadu zarezávajú · Zosúvajú sa dovnútra · Príčina: Na zadnom diele chýba látka pre jej zadok · Oprava: Pridaj krytie na zadnom diele, hlavne smerom k stredu.
32 · Nohavičky sa zarezávajú pri nohe · Guma sa zarezáva do kože · Príčina: Guma prinapnutá alebo malý otvor pre nohu · Oprava: Zníž napätie gumy pri nohách, alebo zväčši otvor.
33 · Pás nohavičiek zosúva alebo sa rolujú · Guma sa prehýba · Príčina: Guma privoľná alebo priúzka · Oprava: Použi pevnejšiu alebo širšiu gumu a pri našívaní stráž napätie.
34 · Rozkrok ťahá vpredu alebo vzadu · Vadí v rozkroku · Príčina: Dĺžka rozkroku je na jej telo zle rozdelená · Oprava: Predĺž alebo skráť rozkrokový diel na strane, ktorá ťahá.
[Všetky kusy]
35 · Skúšobný model sedel, finálny kus nie · Čo sedelo, už nesedí · Príčina: Finálna látka sa nespráva ako látka skúšobného modelu · Oprava: Ušij skúšobný model z látky s podobným správaním, alebo finálnu látku vystuž.
36 · V stoji sedí, v sede nie · Vadí v sede · Príčina: Skúška prebehla len v stoji · Oprava: Pri každej skúške ju popros, nech si sadne, zdvihne ruky a predkloní sa.
37 · Rovnaký strih jednej zákazníčke sedí a druhej nie · Každé telo je iné · Príčina: Strih je robený na základné miery · Oprava: Pred strihaním skúšobného modelu vždy uprav strih na miery konkrétnej zákazníčky.
38 · Opravy nemajú konca · Pri každej skúške sa objaví nový problém · Príčina: Opravuje sa viac vecí naraz a bez poradia · Oprava: Opravuj v poradí: najprv dĺžka, potom obvod, nakoniec tvar (košíčky, krivky). Jednu vec po druhej.
39 · Sedí jej, ale necíti sa v tom dobre · Kus je „podarený“, ale nechce ho nosiť · Príčina: Rozdiel medzi tým, čo čakala, a tým, čo vzniklo · Oprava: Pri prvej dohode sa jej spýtaj, na čo ho bude nosiť a akú oporu má rada; zapíš to do karty.
40 · Látka sa skúškami vyťahala · Skúšobný model je povolený · Príčina: Veľa skúšok na jednom modeli · Oprava: Po dvoch veľkých opravách ustrihni nový skúšobný model podľa opraveného strihu.

14 MIER (z „Ako Vziať Zákazníčke Miery“):
1. Obvod hrudníka cez prsia: Cez najširšie miesto pŕs, meter vodorovne a bez uťahovania.
2. Obvod pod prsiami: Tesne pod prsiami, kde sedí obvodový pás podprsenky. Pevne, ale bez uťahovania.
3. Obvod pása: V najužšom mieste trupu. Uviaž stuhu a popros ju, nech sa pohne: stuha sama zosunie do pása.
4. Horný obvod bokov: Asi 10 cm pod pásom, vo výške panvových kostí.
5. Obvod bokov: Cez najširšie miesto zadku, chodidlá pri sebe.
6. Predná dĺžka do pása: Od jamky medzi kľúčnymi kosťami do pása, stredom.
7. Zadná dĺžka do pása: Od vystúpeného stavca na spodku krku do pása.
8. Výška pŕs: Od miesta, kde sa rameno stretáva s krkom, k prsnému bodu.
9. Vzdialenosť prsných bodov: Vzdialenosť medzi oboma prsnými bodmi.
10. Od línie pod prsiami k pásu: Vpredu, od línie pod prsiami do pása.
11. Od pása k bokom (výška): Na boku, od pása k najširšiemu miestu bokov.
12. Šírka chrbta: Od podpazušia k podpazušiu cez chrbát, ruky voľne pozdĺž tela.
13. Od pása k stehnu v sede: V sede, vpredu, od pása k ohybu nohy. Určuje najväčšiu dĺžku korzetu.
14. Dĺžka trupu (na body): Od ramena cez prednú stranu a rozkrok späť k rovnakému ramenu cez chrbát.

SPRIEVODCA ÚPRAVOU STRIHU: porovnať strih a zákazníčku cez prsia, pod prsiami, v páse, v hornom obvode bokov a v bokoch (polovica tela, bez švových prídavkov); rozdiel rozdeliť do všetkých zvislých okrajov švov na polovici strihu, bez posúvania stredu predku (busk) a stredu chrbta (priechodky); napojiť mäkkými krivkami; keď je rozdiel nerovnomerný, viac na bočné diely a diely cez boky. Dĺžka: vodorovná čiara medzi líniou pod prsiami a pásom (a medzi pásom a bokmi), rozstrihnúť a oddialiť na predĺženie, preložiť na skrátenie. Košíček: viac alebo menej krivky v prsných švoch bez zmeny obvodu. Bielizeň: obvodový pás podľa obvodu pod prsiami s pružnosťou látky; body = dĺžka trupu, opravuje sa v páse; nohavičky = guma a krytie.
PLÁN PRVEJ SKÚŠKY (poradie): 1 zapínanie (rovnomerná medzera na chrbte 4 až 5 cm) · 2 dĺžka (pás na jej páse, môže si sadnúť) · 3 obvod (zopnúť a označiť) · 4 tvar (košíčky, krivky, záhyby) · 5 pohyb (sadnúť si, ruky, predklon) · 6 pohodlie · 7 fotky. Potom: preniesť opravy na strih; po dvoch veľkých opravách nový skúšobný model.
ZLATÉ PRAVIDLO: vždy skúšobný model pred finálnou látkou; opravovať jednu vec po druhej, v poradí dĺžka → obvod → tvar.`
};
/* ===================================================================== */

const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send"), chips = document.getElementById("chips");
document.getElementById("nom").textContent = CHAT.nombre;
document.getElementById("rol").textContent = CHAT.rol;
document.getElementById("av").textContent = (CHAT.nombre || "IA").trim().slice(0, 1).toUpperCase();
q.placeholder = CHAT.placeholder; send.textContent = CHAT.enviar;

let historial = [];
try { historial = JSON.parse(sessionStorage.getItem("chat-" + location.pathname) || "[]"); } catch (e) {}
function persistir() { try { sessionStorage.setItem("chat-" + location.pathname, JSON.stringify(historial.slice(-CHAT.maxHistorial))); } catch (e) {} }

function burbuja(txt, cls) { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = txt; log.append(d); log.scrollTop = log.scrollHeight; return d; }
function limpiar(t) { return t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, "").replace(/^\s*[-*]\s+/gm, "• "); }

burbuja(CHAT.bienvenida, "bot");
historial.forEach(h => burbuja(h.parts[0].text, h.role === "user" ? "yo" : "bot"));
if (!historial.length) CHAT.sugerencias.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => preguntar(s); chips.append(b); });

async function preguntar(texto) {
  texto = (texto || "").trim(); if (!texto) return;
  chips.innerHTML = "";
  burbuja(texto, "yo");
  historial.push({ role: "user", parts: [{ text: texto }] });
  await responder();
}

async function responder() {
  send.disabled = true;
  const t = document.createElement("div"); t.className = "m bot typing"; t.setAttribute("aria-label", "…"); t.innerHTML = "<span></span><span></span><span></span>"; log.append(t); log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(CHAT.proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: CHAT.modelo,
        systemInstruction: { parts: [{ text: CHAT.sistema }] },
        contents: historial.slice(-CHAT.maxHistorial),
        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
      })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
    if (!txt) throw new Error("vacío");
    t.remove();
    burbuja(limpiar(txt), "bot");
    historial.push({ role: "model", parts: [{ text: txt }] });
    persistir();
  } catch (e) {
    t.remove();
    const d = burbuja(CHAT.errorTxt, "err");
    const b = document.createElement("button"); b.type = "button"; b.textContent = CHAT.reintentar;
    b.onclick = () => { d.remove(); responder(); };
    d.append(document.createElement("br"), b);
  } finally { send.disabled = false; q.focus(); }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = q.value; q.value = ""; q.style.height = "auto"; preguntar(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
</script>
