<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Autorské korzetárstvo — pripravujeme</title>
<style>
  :root{ --paper:#F8F3ED; --ink:#1C1817; --muted:#66584F; --wine:#43161C; --wine-deep:#2C1016; --gold:#B58E5E; --line:#CEBCA8; }
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  .wrap{max-width:620px;margin:0 auto;padding:56px 20px 72px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 26px;text-align:center}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
  h1{font-family:Georgia,serif;font-size:28px;line-height:1.25;color:var(--wine-deep);margin:0 0 16px}
  p{font-size:16px;line-height:1.65;color:var(--muted);margin:0 0 14px}
  .rule{height:1px;background:var(--line);margin:24px 0}
  .next{font-family:Georgia,serif;font-size:17px;color:var(--wine);margin:0}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="kicker">Autorské korzetárstvo</p>
      <h1>Tvoj prístup sa pripravuje</h1>
      <p>Táto stránka je tvoja. Odkaz sa už nezmení, takže si ho môžeš uložiť do záložiek.</p>
      <p>Strihy a príručky sa tu objavia zakrátko. Nič nemusíš robiť.</p>
      <div class="rule"></div>
      <p class="next">Ďalší krok: otvor tento odkaz znova o chvíľu.</p>
    </div>
  </div>
</body>
</html>
