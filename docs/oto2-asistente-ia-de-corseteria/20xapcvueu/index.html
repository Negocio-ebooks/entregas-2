LAS 14 MEDIDAS (de «Cómo Tomar Medidas a tu Clienta»):
1. Contorno de busto: Por la parte más saliente del busto, con la cinta horizontal y sin apretar.
2. Bajo busto: Justo debajo del pecho, donde apoya la banda del brasier. Firme pero sin apretar.
3. Cintura: En la parte más angosta del torso. Ata una cinta y pídele que se mueva: la cinta baja sola a su cintura.
4. Cadera alta: Unos 10 cm debajo de la cintura, a la altura de los huesos de la cadera.
5. Cadera: Por la parte más saliente de la cola, con los pies juntos.
6. Largo de talle delantero: Desde el hueco entre las clavículas hasta la cintura, pasando por el centro.
7. Largo de talle espalda: Desde la vértebra que sobresale en la base del cuello hasta la cintura.
8. Altura de busto: Desde el punto donde el hombro se une al cuello hasta la punta del busto.
9. Separación de busto: Distancia entre las dos puntas del busto.
10. Bajo busto a cintura: En el frente, desde la línea de bajo busto hasta la cintura.
11. Cintura a cadera (largo): Al costado, desde la cintura hasta la parte más saliente de la cadera.
12. Ancho de espalda: De axila a axila por la espalda, con los brazos relajados.
13. Cintura a muslo sentada: Sentada, al frente, desde la cintura hasta donde se dobla la pierna. Define el largo máximo del corsé.
14. Largo de torso (para bodies): Desde el hombro, por delante, pasando por la entrepierna, hasta el mismo hombro por la espalda.

REGLA DE ORO: siempre muestra antes de la tela final; corregir una por una cosa, en orden largo → contorno → forma.`

async function preguntar(texto) {

  burbuja(texto, "yo");
  historial.push({ role: "user", parts: [{ text: texto }] });
  await responder();
}

async function responder() {
  send.disabled = true;

        contents: historial.slice(-CHAT.maxHistorial),
        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }

    const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
    if (!txt) throw new Error("vacío");
    t.remove();
    burbuja(limpiar(txt), "bot");
    historial.push({ role: "model", parts: [{ text: txt }] });
    persistir();
  } catch (e) {
    t.remove();
    const d = burbuja(CHAT.errorTxt, "err");
    const b = document.createElement("button"); b.type = "button"; b.textContent = CHAT.reintentar;
    b.onclick = () => { d.remove(); responder(); };
    d.append(document.createElement("br"), b);
  } finally { send.disabled = false; q.focus(); }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = q.value; q.value = ""; q.style.height = "auto"; preguntar(v); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
